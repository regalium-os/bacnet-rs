[package]
name = "regalium-bacnet"
description = "BACnet driver for RegaliumOS: a pure-Rust ASHRAE 135 stack with a sans-io core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
regalium-bacnet-core.workspace = true
regalium-bacnet-ip.workspace = true
regalium-bacnet-ipv6.workspace = true
regalium-bacnet-mstp.workspace = true
regalium-bacnet-runtime.workspace = true
regalium-bacnet-sc.workspace = true
regalium-bacnet-schema.workspace = true
regalium-bacnet-telemetry.workspace = true
# Opt-in: exporting through the telemetry SDK brings its native compression
# libraries (zstd, lz4) and a C toolchain. A plain dependency on the driver
# stays pure Rust and a one-flag cross build; `cargo xtask deps` holds it so.
regalium-bacnet-telemetry-otel = { workspace = true, optional = true }

[features]
otel = ["dep:regalium-bacnet-telemetry-otel"]

[[example]]
name = "otlp_spans"
required-features = ["otel"]

[lints]
workspace = true
