syntax = "proto3";

package bacnet.object.v1;

import "bacnet/object/v1/subscription.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "SubscriptionMessagesProto";
option java_package = "dev.regalium.bacnet.object.v1";

// Request message for SubscriptionService.CreateSubscription.
message CreateSubscriptionRequest {
  // The object to follow.
  // Format: devices/{device}/objects/{object}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Subscription"
  ];

  // The subscription.
  Subscription subscription = 2 [(google.api.field_behavior) = REQUIRED];

  // The identifier to use; empty lets the service choose.
  string subscription_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Request message for SubscriptionService.GetSubscription.
message GetSubscriptionRequest {
  // The subscription.
  // Format: devices/{device}/objects/{object}/subscriptions/{subscription}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "bacnet.regalium.dev/Subscription"
  ];
}

// Request message for SubscriptionService.ListSubscriptions.
message ListSubscriptionsRequest {
  // The object, or `devices/-/objects/-` for every subscription held.
  // Format: devices/{device}/objects/{object}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Subscription"
  ];

  // Maximum number to return; zero selects a default.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListSubscriptions call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for SubscriptionService.ListSubscriptions.
message ListSubscriptionsResponse {
  // The subscriptions.
  repeated Subscription subscriptions = 1;

  // Pass to the next ListSubscriptions call; empty when there are no more.
  string next_page_token = 2;
}

// Request message for SubscriptionService.DeleteSubscription.
message DeleteSubscriptionRequest {
  // The subscription to cancel.
  // Format: devices/{device}/objects/{object}/subscriptions/{subscription}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "bacnet.regalium.dev/Subscription"
  ];
}

// Request message for SubscriptionService.StreamNotifications.
message StreamNotificationsRequest {
  // The object whose notifications to stream, or `devices/-/objects/-` for
  // every subscription's.
  // Format: devices/{device}/objects/{object}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Subscription"
  ];
}

// Response message for SubscriptionService.StreamNotifications: whatever
// arrived since the previous response.
message StreamNotificationsResponse {
  // The notifications, oldest first.
  repeated Notification notifications = 1;

  // Notifications discarded since the previous response because the reader
  // fell behind. Non-zero means a value was missed, not merely delayed.
  int64 dropped_count = 2;
}
