syntax = "proto3";

package bacnet.object.v1;

import "bacnet/object/v1/datetime.proto";
import "bacnet/object/v1/enums.proto";
import "bacnet/object/v1/identifier.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";

option java_multiple_files = true;
option java_outer_classname = "ValueProto";
option java_package = "dev.regalium.bacnet.object.v1";

// One BACnet value: any of the thirteen application-tagged primitives of
// ASHRAE 135 §20.2.2 to §20.2.14, or a constructed value built from them.
//
// Every property of every object is one of these, which is why the schema
// has one generic property and not a message per property: the standard
// defines several hundred properties, vendors add their own above 512, and a
// schema that typed each one would be out of date the day a device shipped a
// property nobody had listed.
message Value {
  // The value. Field numbers follow the application tag numbers, plus one.
  oneof kind {
    // Application tag 0, §20.2.2. Written at a priority, a null relinquishes
    // that slot of a commandable object's priority array, §19.2.3.
    google.protobuf.NullValue null_value = 1;

    // Application tag 1, §20.2.3.
    bool boolean_value = 2;

    // Application tag 2, §20.2.4. Signed because AIP-141 forbids unsigned
    // scalars; BACnet unsigned values above 2^63 - 1 are vanishingly rare,
    // and encoded carries any value exactly.
    int64 unsigned_value = 3 [(buf.validate.field).int64.gte = 0];

    // Application tag 3, §20.2.5.
    int64 signed_value = 4;

    // Application tag 4, §20.2.6: IEEE 754 single precision, which is what
    // nearly every analog present-value is.
    float real_value = 5;

    // Application tag 5, §20.2.7.
    double double_value = 6;

    // Application tag 6, §20.2.8.
    bytes octet_string_value = 7;

    // Application tag 7, §20.2.9.
    CharacterString character_string_value = 8;

    // Application tag 8, §20.2.10.
    BitString bit_string_value = 9;

    // Application tag 9, §20.2.11. A number: what it names depends on the
    // property it is the value of, and the property's documentation says.
    int64 enumerated_value = 10 [(buf.validate.field).int64 = {
      gte: 0
      lte: 4294967295
    }];

    // Application tag 10, §20.2.12.
    Date date_value = 11;

    // Application tag 11, §20.2.13.
    Time time_value = 12;

    // Application tag 12, §20.2.14.
    ObjectId object_id_value = 13;

    // A sequence, list or array of values, §20.2.1.3.2.
    Constructed constructed_value = 14;
  }

  // The value exactly as the device encoded it: tag, length and contents.
  //
  // Decoding is lossless (the core re-encodes it byte for byte), but a
  // protobuf field cannot say that a device used a needlessly long length, a
  // reserved bit, or an unsigned above 2^63. These octets can, so equipment
  // that does not follow the standard can be inspected through this API
  // rather than silently normalised by it.
  bytes encoded = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// A character string and the set it was encoded in, §20.2.9.
message CharacterString {
  // The text, converted to UTF-8 from its character set.
  string text = 1 [(google.api.field_behavior) = REQUIRED];

  // The set the device used. Writes use UTF-8 unless told otherwise.
  CharacterSet character_set = 2 [(google.api.field_behavior) = OPTIONAL];
}

// A bit string, §20.2.10: status flags, event-enable, the services a device
// supports. The meaning of each bit belongs to the property.
message BitString {
  // The bits, most significant first, as the standard numbers them.
  repeated bool bits = 1 [(google.api.field_behavior) = OPTIONAL];
}

// A constructed value, §20.2.1.3.2: the contents of an array, a list, or a
// sequence such as a BACnetDateTime or a priority array.
message Constructed {
  // The elements, in wire order.
  repeated ConstructedElement elements = 1 [(google.api.field_behavior) = OPTIONAL];
}

// One element of a constructed value.
message ConstructedElement {
  // The context tag that introduced it, when it had one. Absent for an
  // application-tagged element, as in an array of reals.
  optional int32 context_tag = 1 [(buf.validate.field).int32 = {
    gte: 0
    lte: 254
  }];

  // The element. A context-tagged primitive whose type the decoder could not
  // know is carried as its raw contents, in octet_string_value, rather than
  // guessed at.
  Value value = 2 [(google.api.field_behavior) = REQUIRED];
}
