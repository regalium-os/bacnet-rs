syntax = "proto3";

package bacnet.object.v1;

option java_multiple_files = true;
option java_outer_classname = "EnumsProto";
option java_package = "dev.regalium.bacnet.object.v1";

// The character set a CharacterString was encoded in: the octet that opens
// its contents, ASHRAE 135 §20.2.9.
//
// A closed set, so an enum. Each value is the wire octet plus one, because
// protobuf reserves zero for "unspecified" and the standard gives zero to
// UTF-8.
enum CharacterSet {
  // Default, unused. Every character string on the wire states its set.
  CHARACTER_SET_UNSPECIFIED = 0;

  // ISO 10646 UTF-8, which the standard calls ANSI X3.4 for historical
  // reasons. Wire octet 0, and what nearly every device sends.
  CHARACTER_SET_UTF_8 = 1;

  // IBM/Microsoft DBCS. Wire octet 1.
  CHARACTER_SET_DBCS = 2;

  // JIS X 0208. Wire octet 2.
  CHARACTER_SET_JIS_X_0208 = 3;

  // ISO 10646 UCS-4. Wire octet 3.
  CHARACTER_SET_UCS_4 = 4;

  // ISO 10646 UCS-2. Wire octet 4.
  CHARACTER_SET_UCS_2 = 5;

  // ISO 8859-1. Wire octet 5.
  CHARACTER_SET_ISO_8859_1 = 6;
}
