syntax = "proto3";

package bacnet.object.v1;

import "bacnet/object/v1/identifier.proto";
import "bacnet/object/v1/object.proto";
import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_outer_classname = "ObjectMessagesProto";
option java_package = "dev.regalium.bacnet.object.v1";

// Request message for ObjectService.GetObject.
message GetObjectRequest {
  // The object to read.
  // Format: devices/{device}/objects/{object}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "bacnet.regalium.dev/Object"
  ];
}

// Request message for ObjectService.ListObjects.
message ListObjectsRequest {
  // The device whose object-list to read.
  // Format: devices/{device}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Object"
  ];

  // Maximum number of objects to return. The server may return fewer; zero
  // selects a server-chosen default.
  int32 page_size = 2 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).int32 = {
      gte: 0
      lte: 1000
    }
  ];

  // A page token from a previous ListObjects call. It records a position in
  // the device's object-list, so a list that changes between pages may skip
  // or repeat an object; BACnet offers no snapshot to page through.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, AIP-160: `object_type = "analog-input"`, or
  // `status_flags.alarm = true` for every point in alarm.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ObjectService.ListObjects.
message ListObjectsResponse {
  // The objects, in object-list order.
  repeated Object objects = 1;

  // Pass to the next ListObjects call for the following page; empty when
  // there are no more.
  string next_page_token = 2;
}

// Request message for ObjectService.CreateObject.
message CreateObjectRequest {
  // The device to create the object in.
  // Format: devices/{device}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Object"
  ];

  // The object, with object_type set; its other fields become the
  // CreateObject request's initial values.
  Object object = 2 [(google.api.field_behavior) = REQUIRED];

  // The identifier, `analog-value-7`. Empty asks the device to choose the
  // instance, which not every device supports.
  string object_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (buf.validate.field).string.pattern = "^[a-z][a-z0-9-]*-[0-9]+$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

// Request message for ObjectService.UpdateObject.
message UpdateObjectRequest {
  // The object to update. Its name field identifies which.
  Object object = 1 [(google.api.field_behavior) = REQUIRED];

  // Fields to write: display_name, description, present_value,
  // isolated. An empty mask writes every one of those that is set.
  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for ObjectService.DeleteObject.
message DeleteObjectRequest {
  // The object to delete from the device's database.
  // Format: devices/{device}/objects/{object}
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "bacnet.regalium.dev/Object"
  ];
}

// Request message for ObjectService.FindObjects.
message FindObjectsRequest {
  // The device to ask, or `devices/-` to ask every device that hears the
  // broadcast.
  // Format: devices/{device}
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "bacnet.regalium.dev/Object"
  ];

  // What to look for: the object, or its name. Who-Has carries exactly one.
  oneof target {
    // An object identifier.
    ObjectId object_id = 2;

    // An object-name, matched exactly as the device stores it.
    string display_name = 3;
  }

  // How long to listen for I-Have replies. Defaults to three seconds.
  google.protobuf.Duration wait = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for ObjectService.FindObjects.
message FindObjectsResponse {
  // Every object that answered, with name, object_type, instance and
  // display_name set; nothing else is in an I-Have.
  repeated Object objects = 1;
}
