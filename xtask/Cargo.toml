# The conformance gates. This is tooling, not a shipped artefact, so it is the
# one crate in the workspace permitted a dependency for convenience rather than
# necessity -- and it is excluded from the driver's own dependency graph.
[package]
name = "xtask"
description = "Architecture, size, purity, dependency and licence gates for the Regalium BACnet driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `cargo metadata` speaks JSON. Reading the resolved graph is the only way to
# catch a banned crate that arrives transitively, which is exactly the failure
# no amount of reading our own manifests would reveal.
serde_json = "1"

[lints]
workspace = true
